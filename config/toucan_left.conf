# Systems that apply a 2M PHY update on reconnect, after BlueZ has already set peripheral latency 30.
# The link then supervision-timeouts and the host cycles paired/connected.
# https://github.com/zmkfirmware/zmk/issues/3309
# https://zmk.dev/docs/troubleshooting/connection-issues#additional-bluetooth-options
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# Central only. The peripheral does not build zmk_modifiers_state_changed,
# and status_advertisement.c subscribes to that event unconditionally.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Toucan2"

CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

# The right half sends no cursor or key events until power-cycled.
# Queue of events the left half receives from the right half.
# Trackpad samples and key events share it.
# A full queue drops the put, so the default drops right-half keys while the trackpad is moving.
# https://zmk.dev/docs/config/split
# https://github.com/zmkfirmware/zmk/blob/v0.3/app/src/split/bluetooth/Kconfig
# Max number of key position state events to queue when received from peripherals
# default 5
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
